[package]
name = "smile-ai-image-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "smile_ai_image_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
semver.workspace = true
smile-core = { path = "../../crates/smile-core" }
smile-mcp = { path = "../../crates/smile-mcp" }
tauri = { version = "2.8", features = [] }
tauri-plugin-single-instance = { version = "2.3", features = ["deep-link"] }
tauri-plugin-opener = "2.5"
toml_edit.workspace = true
tempfile = "3.23"
